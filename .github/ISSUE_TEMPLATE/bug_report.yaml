name: 🐛 Bug report
description: Report an issue (Something not working? Something went wrong? Report it here!)
type: Bug
labels: [pending triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. If you intend to submit a PR for this issue, tell us in the description. Thanks!
      placeholder: Bug description
    validations:
      required: trueDescription: Briefly describe the core content of the issue.  Reproducibility: Can the issue be reproduced by specific triggering conditions?  Triggering Conditions: Conditions that trigger the issue.  Resulting Issue: The problem caused by triggering this issue.
  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: Output of `npx envinfo --system --binaries --browsers`
      render: Shell
      placeholder: OS Name: Name of the device's operating system.  OS Version: Version number of the device's operating system.  Runtime Platform: Platform on which the operating system runs (e.g., x86, x64, ARM, etc.).  Icelet Version: Version number of the Icelet where the issue occurred.  Output Information: The last console output message(s) prior to the issue occurring.  Screenshot or Screen Recording: (Please upload as an attachment)  Remarks: Additional information, such as exceptional circumstances or your own speculations.  
    validations:
      required: true
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        - label: Follow our [Code of Conduct](https://github.com/BualoStudio/TheNativePond/blob/main/.github/CODE_OF_CONDUCT.md)
          required: true
        - label: Read the [https://github.com/BualoStudio/TheNativePond/blob/main/.github/CONTRIBUTING.md).
          required: true
        - label: Check that there isn't already an issue that reports the same bug to avoid creating a duplicate.
          required: true
        - label: Check that this is a concrete bug. For Q&A, please open a GitHub Discussion instead.
          required: true
  - type: checkboxes
    id: contributions
    attributes:
      label: Contributions
      description: Please note that Open Source projects are maintained by volunteers, where your cases might not be always relevant to the others. It would make things move faster if you could help investigate and propose solutions.
      options:
        - label: I am willing to submit a PR to fix this issue
        - label: I am willing to submit a PR with failing tests (actually just go ahead and do it, thanks!)
